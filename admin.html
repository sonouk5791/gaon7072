<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 모드 | 가온복지센터</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f1f5f9; min-height: 100vh;">

    <!-- Admin Navigation Bar -->
    <header class="admin-navbar">
        <div class="logo-text">
            <strong>가온복지센터</strong> <span>관리자모드</span>
        </div>
        <div class="admin-nav-actions">
            <a href="index.html" class="admin-nav-btn"><i class="fa-solid fa-house"></i> 홈페이지 바로가기</a>
        </div>
    </header>

    <div class="admin-container">
        <!-- Title Area -->
        <div class="admin-title-area">
            <h1 class="admin-title">
                <i class="fa-solid fa-sliders" style="color: var(--color-primary);"></i> 통합 관리자 센터
            </h1>
        </div>

        <!-- Navigation Tabs -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="tabConsultations">
                <i class="fa-solid fa-list-check"></i> 상담 신청 내역
            </button>
            <button class="admin-tab" data-tab="tabCalculator">
                <i class="fa-solid fa-calculator"></i> 이용료 계산기 설정 (150분·210분 포함)
            </button>
            <button class="admin-tab" data-tab="tabSiteSettings">
                <i class="fa-solid fa-building"></i> 기관 기본 설정
            </button>
        </div>

        <!-- Tab 1: Consultation Requests -->
        <div id="tabConsultations" class="admin-tab-content active">
            <div class="admin-card">
                <div class="admin-card-title">
                    <i class="fa-solid fa-headset"></i> 간편 상담 신청 접수 목록
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>접수일시</th>
                                <th>보호자명</th>
                                <th>연락처</th>
                                <th>어르신 연령</th>
                                <th>요청 서비스</th>
                                <th>문의사항</th>
                                <th>처리 상태</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="consultationTableBody">
                            <!-- Injected by js/admin.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tab 2: Calculator Unit Costs & Rates Settings -->
        <div id="tabCalculator" class="admin-tab-content">
            <div class="admin-card">
                <div class="admin-card-title">
                    <i class="fa-solid fa-calculator"></i> 이용료 계산기 서비스 단가 및 등급별 한도액 설정
                </div>

                <form id="calcSettingsForm">
                    <!-- ① 방문요양 서비스 단가 (150분 이상 / 210분 포함) -->
                    <h3 style="font-size: 1.15rem; font-weight: 700; color: #1e5a48; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">
                        <i class="fa-solid fa-hands-helping"></i> 방문요양 회당 서비스 단가 (원)
                    </h3>
                    <div class="admin-form-subgrid" style="margin-bottom: 30px;">
                        <div class="form-group">
                            <label class="form-label" for="costVisit30">30분 이상 단가</label>
                            <input type="number" id="costVisit30" class="form-input" placeholder="17,450">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="costVisit60">60분 이상 단가</label>
                            <input type="number" id="costVisit60" class="form-input" placeholder="25,320">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="costVisit90">90분 이상 단가</label>
                            <input type="number" id="costVisit90" class="form-input" placeholder="34,120">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="costVisit120">120분 이상 단가</label>
                            <input type="number" id="costVisit120" class="form-input" placeholder="43,430">
                        </div>
                        <div class="form-group" style="background: #f0fdf9; padding: 10px; border-radius: 8px; border: 1.5px solid #10b981;">
                            <label class="form-label" for="costVisit150" style="color: #065f46; font-weight: 700;">
                                <i class="fa-solid fa-check-circle" style="color: #10b981;"></i> 150분 이상 단가
                            </label>
                            <input type="number" id="costVisit150" class="form-input" placeholder="50,640" style="font-weight: 700; color: #065f46;">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="costVisit180">180분 이상 단가</label>
                            <input type="number" id="costVisit180" class="form-input" placeholder="57,020">
                        </div>
                        <div class="form-group" style="background: #f0fdf9; padding: 10px; border-radius: 8px; border: 1.5px solid #10b981;">
                            <label class="form-label" for="costVisit210" style="color: #065f46; font-weight: 700;">
                                <i class="fa-solid fa-star" style="color: #10b981;"></i> 210분 이상 단가
                            </label>
                            <input type="number" id="costVisit210" class="form-input" placeholder="63,530" style="font-weight: 700; color: #065f46;">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="costVisit240">240분 이상 단가</label>
                            <input type="number" id="costVisit240" class="form-input" placeholder="70,080">
                        </div>
                    </div>

                    <!-- ② 방문목욕 서비스 단가 -->
                    <h3 style="font-size: 1.15rem; font-weight: 700; color: #1e5a48; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">
                        <i class="fa-solid fa-bath"></i> 방문목욕 회당 서비스 단가 (원)
                    </h3>
                    <div class="admin-form-subgrid" style="margin-bottom: 30px;">
                        <div class="form-group grid-span-2">
                            <label class="form-label" for="costBath">차량 내 목욕 (60분 이상)</label>
                            <input type="number" id="costBath" class="form-input" placeholder="88,990">
                            <small style="color: #64748b; font-size: 0.8rem; margin-top: 4px; display: block;">
                                ※ 40분~60분 미만 단가는 60분 이상 단가의 80%가 자동 산정됩니다.
                            </small>
                        </div>
                    </div>

                    <!-- ③ 재가급여 월 한도액 (1~5등급) -->
                    <h3 style="font-size: 1.15rem; font-weight: 700; color: #1e5a48; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">
                        <i class="fa-solid fa-sack-dollar"></i> 재가급여 등급별 월 한도액 (원)
                    </h3>
                    <div class="admin-form-subgrid" style="margin-bottom: 30px;">
                        <div class="form-group">
                            <label class="form-label" for="rateGrade1">1등급 월 한도액</label>
                            <input type="number" id="rateGrade1" class="form-input" placeholder="2,512,900">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rateGrade2">2등급 월 한도액</label>
                            <input type="number" id="rateGrade2" class="form-input" placeholder="2,331,200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rateGrade3">3등급 월 한도액</label>
                            <input type="number" id="rateGrade3" class="form-input" placeholder="1,528,200">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rateGrade4">4등급 월 한도액</label>
                            <input type="number" id="rateGrade4" class="form-input" placeholder="1,409,700">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rateGrade5">5등급 월 한도액</label>
                            <input type="number" id="rateGrade5" class="form-input" placeholder="1,208,900">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="rateGradeCognitive">인지지원등급 월 한도액</label>
                            <input type="number" id="rateGradeCognitive" class="form-input" placeholder="658,900">
                        </div>
                    </div>

                    <div class="admin-form-actions">
                        <button type="button" id="resetCalcBtn" class="btn-admin-action btn-admin-danger" style="padding: 12px 20px;">
                            <i class="fa-solid fa-rotate-left"></i> 기본 고시 단가로 초기화
                        </button>
                        <button type="submit" class="btn-primary" style="padding: 12px 28px; border-radius: 8px; font-weight: 700;">
                            <i class="fa-solid fa-floppy-disk"></i> 계산기 설정 저장하기
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tab 3: Site Settings -->
        <div id="tabSiteSettings" class="admin-tab-content">
            <div class="admin-card">
                <div class="admin-card-title">
                    <i class="fa-solid fa-building"></i> 기관 정보 설정
                </div>

                <form id="siteSettingsForm">
                    <div class="admin-form-grid">
                        <div class="form-group">
                            <label class="form-label" for="agencyName">기관명</label>
                            <input type="text" id="agencyName" class="form-input" value="가온복지센터">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ownerName">대표자명 / 센터장</label>
                            <input type="text" id="ownerName" class="form-input" value="최대웅">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phoneNum">전화번호</label>
                            <input type="text" id="phoneNum" class="form-input" value="063-584-7072">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="faxNum">팩스번호</label>
                            <input type="text" id="faxNum" class="form-input" value="063-584-7073">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="emailAddr">이메일 주소</label>
                            <input type="email" id="emailAddr" class="form-input" value="gaon7072@naver.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="agencyAddress">기관 주소</label>
                            <input type="text" id="agencyAddress" class="form-input" value="전북특별자치도 부안군 부안읍 용계길 13">
                        </div>
                        <div class="form-group grid-span-2">
                            <label class="form-label" for="hoursWeekday">평일 운영시간 안내</label>
                            <input type="text" id="hoursWeekday" class="form-input" value="08:00 ~ 17:00 (17:00 이후 센터장 연결)">
                        </div>
                    </div>

                    <div class="admin-form-actions">
                        <button type="submit" class="btn-primary" style="padding: 12px 28px; border-radius: 8px; font-weight: 700;">
                            <i class="fa-solid fa-floppy-disk"></i> 기관 설정 저장하기
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- JS -->
    <script src="js/admin.js"></script>
</body>
</html>
